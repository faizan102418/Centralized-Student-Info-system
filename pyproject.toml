[project]
name = "student-record-chatbot"
version = "0.1.0"
description = "A RAG-based chatbot that answers natural-language questions about student records, built with LangChain, ChromaDB, MySQL, and the Groq API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "mysql-connector-python>=9.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "bcrypt>=4.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]

[tool.ruff]
line-length = 100
